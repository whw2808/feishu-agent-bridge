[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-agent-bridge"
version = "0.1.0"
description = "Independent background Feishu collaboration for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
agent = ["openai-codex>=0.162.0,<0.163"]
mcp = ["mcp>=1.20,<2"]
dev = ["build>=1.2", "ruff>=0.12"]

[project.scripts]
feishu-agent = "feishu_agent_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
